# Render Blueprint for the Blue Balance API.
#
# In Render: New -> Blueprint -> connect this repo. Render reads this file and
# provisions everything below. You do not paste a connection string or invent a
# signing key — both are wired automatically:
#   - DATABASE_URL comes fromDatabase, so Render fills in the Postgres it creates
#   - AUTH_JWT_SECRET is generateValue, so Render generates a strong one and
#     keeps it stable across deploys
#
# Migrations apply at startup, so there is no release command to configure.
#
# The keys marked sync:false are the ones only you can supply. Render prompts for
# them during blueprint creation and they are optional — the API runs without
# them, it just returns 500 from the AI coach and cannot create Stripe sessions.

databases:
  - name: blue-balance-db
    databaseName: blue_balance
    user: blue_balance
    plan: free # upgrade to `basic-256mb` or higher before real traffic

services:
  - type: web
    name: blue-balance-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free # free instances sleep when idle; first request after a sleep is slow
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blue-balance-db
          property: connectionString

      - key: AUTH_JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      # AI coach. Any endpoint speaking the OpenAI chat-completions shape works;
      # AI_BASE_URL is the root that has /chat/completions under it. Without a
      # key, /functions/ai-coach returns 500.
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

      # Only needed for billing on web/Android. iOS is free in 1.0.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PREMIUM_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_ANNUAL_PRICE_ID
        sync: false

      # Optional third barcode provider. The first two need no key.
      - key: GO_UPC_API_KEY
        sync: false

      # Password reset cannot deliver without these, and says so rather than
      # pretending it sent something. Free tier at resend.com.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
